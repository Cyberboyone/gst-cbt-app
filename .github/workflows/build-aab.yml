name: Build Android App Bundle (Play Store)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEY_ALIAS: cbtapp
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Must be an ABSOLUTE path. build.gradle resolves this via `new File(...)`,
      # and a relative path here is ambiguous because Gradle/Flutter invoke the
      # app module's build.gradle from a working directory that does not match
      # the repo root where this file is actually written below -- a relative
      # path silently fails to resolve, which combined with the previous
      # (now-fixed) signing-config bug is part of why release builds were
      # falling back to debug signing.
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Build App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GST-CBT-App-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
